# Local dev only — runs Eleventy's own dev server with live reload.
# Not used in production; see Dockerfile / .github/workflows for that build.

services:
  dev:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npx eleventy --serve"
    ports:
      - "8280:8080"
    volumes:
      - .:/app
      - node_modules:/app/node_modules

volumes:
  node_modules:
