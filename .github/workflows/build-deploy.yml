name: build-deploy

on:
  push:
    branches: [main]

env:
  IMAGE: ghcr.io/krzlew/vcard

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_COMPOSE_DIR }}
            docker compose pull vcard
            docker compose up -d vcard

      - name: Submit sitemap to IndexNow
        run: |
          sleep 10
          urls=$(curl -fsSL https://htsh.pl/sitemap.xml | grep -oE '<loc>[^<]+</loc>' | sed -E 's#</?loc>##g')
          urlList=$(printf '%s\n' "$urls" | jq -R . | jq -s .)
          curl -fsS -X POST https://api.indexnow.org/indexnow \
            -H "Content-Type: application/json" \
            -d "{\"host\":\"htsh.pl\",\"key\":\"62611073cbc6e41a8a8bf05eac0b32b6\",\"keyLocation\":\"https://htsh.pl/62611073cbc6e41a8a8bf05eac0b32b6.txt\",\"urlList\":$urlList}"
